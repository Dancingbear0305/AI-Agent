# Linux only: host networking connects to the VM's existing local MySQL.
services:
  ditto-lab:
    build: .
    network_mode: host
    environment:
      HOST: ${HOST:-127.0.0.1}
      PORT: ${PORT:-8080}
      DB_BACKEND: ${DB_BACKEND:-sqlite}
      DB_HOST: ${DB_HOST:-127.0.0.1}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-cindydb}
      DB_USER: ${DB_USER:-cindy_app}
      DB_PASSWORD: ${DB_PASSWORD:-}
      AI_MODE: ${AI_MODE:-demo}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
    volumes:
      - ditto-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('PORT','8080')+'/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  ditto-data:
